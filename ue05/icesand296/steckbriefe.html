<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steckbrief-Verzeichnis – Corporate Design der THM</title>
  <style>
    :root {
      --thm-gruen: #80BA24;
      --thm-grau: #4A5C66;
      --thm-rot: #9C132E;
      --thm-gelb: #F4AA00;
      --thm-hellblau: #00B8E4;
      --thm-blau: #002878;
      --weiss: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--weiss);
      color: var(--thm-grau);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 70rem;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    h1 {
      margin: 0 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 0.25rem solid var(--thm-gruen);
      color: var(--thm-grau);
      font-size: 2rem;
    }

    .hinweis {
      border-left: 0.25rem solid var(--thm-gelb);
      padding-left: 0.75rem;
    }

    label {
      display: block;
      margin: 1.5rem 0 0.5rem;
      font-weight: 700;
    }

    input[type="search"] {
      width: 100%;
      max-width: 32rem;
      padding: 0.6rem 0.75rem;
      border: 2px solid var(--thm-grau);
      background: var(--weiss);
      color: var(--thm-grau);
      font: inherit;
    }

    input[type="search"]:focus-visible {
      outline: 3px solid var(--thm-gruen);
      outline-offset: 2px;
    }

    #treffer {
      margin: 0.5rem 0 1rem;
    }

    .spalten {
      display: grid;
      grid-template-columns: minmax(15rem, 20rem) minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 45rem) {
      .spalten {
        grid-template-columns: 1fr;
      }
    }

    #liste {
      max-height: 65vh;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      border: 1px solid var(--thm-grau);
      list-style: none;
    }

    #liste li {
      border-bottom: 1px solid var(--thm-grau);
    }

    #liste li:last-child {
      border-bottom: 0;
    }

    .eintrag {
      display: block;
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 0;
      border-left: 0.25rem solid var(--weiss);
      background: var(--weiss);
      color: var(--thm-blau);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .eintrag:hover {
      border-left-color: var(--thm-gruen);
    }

    .eintrag:focus-visible {
      outline: 3px solid var(--thm-gruen);
      outline-offset: -3px;
    }

    .eintrag[aria-current="true"] {
      border-left-color: var(--thm-gruen);
      background: var(--thm-grau);
      color: var(--weiss);
    }

    .eintrag .name {
      display: block;
      font-weight: 700;
    }

    .eintrag .studium {
      display: block;
      font-size: 0.85rem;
    }

    .karte {
      padding: 1rem 1.25rem;
      border: 1px solid var(--thm-grau);
      background: var(--weiss);
    }

    .karte h2 {
      margin: 0 0 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 0.25rem solid var(--thm-gruen);
      color: var(--thm-grau);
      font-size: 1.5rem;
    }

    .karte h3 {
      margin: 1.25rem 0 0.35rem;
      color: var(--thm-grau);
      font-size: 1.05rem;
    }

    .karte p,
    .karte li {
      max-width: 46rem;
    }

    .karte ul {
      padding-left: 1.25rem;
    }

    a {
      color: var(--thm-rot);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-thickness: 3px;
    }
  </style>
</head>
<body>

  <script>
    "use strict";

    const steckbriefe = [{"name":"aalg","studium":"Wirtschaftsinformatik B.Sc., 5. Semester","suche":"aalg studiengang und semester wirtschaftsinformatik b.sc., 5. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 5. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Einführung in die Programmierung absolviert. Auf IntelliJ gearbeitet mit Java.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Erklärungen so gut wie es geht zu übermitteln.\u003c/p>"},{"name":"aayd","studium":"Wirtschaftsinformatik, 5. Semester","suche":"aayd studiengang und semester wirtschaftsinformatik, 5. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik, 5. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bereits in Hochschulprojekten mit verschiedenen Programmiersprachen und Technologien gearbeitet und dabei Erfahrungen mit Git und GitHub gesammelt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte meine Kenntnisse in der Softwareentwicklung erweitern und lernen, wie man Softwareprojekte strukturiert und erfolgreich umsetzt.\u003c/p>"},{"name":"adni","studium":"Wirtschaftsinformatik und 3. Semester","suche":"adni studiengang und semester wirtschaftsinformatik und 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik und 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…\u003c/p>"},{"name":"AF","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"af studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Selbst bisher nicht wirklich programmiert. Aktuell CS Managerin bei einem FinTech und betreue zwei Softwarelösungen für den öffentlichen Sektor mit.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erhoffe mir einen tieferen Einblick in die Softwareentwicklung und wie ich Werkzeuge wie Git und GitHub sicher anwenden kann.\u003c/p>"},{"name":"agbr","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"agbr studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe im Studium erste Erfahrungen mit der Programmierung in Java sammeln können. Mit der Entwicklung größerer Softwareprojekte habe ich bisher noch wenig Erfahrung:)\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte lernen wie Softwareprojekte geplant, entwickelt und umgesetzt werden und dabei praktische Erfahrungen sammeln.\u003c/p>"},{"name":"Agub","studium":"Organisation und IT-Sicherehit B.Sc 3. Semester","suche":"agub studiengang und semester organisation und it-sicherehit b.sc 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Organisation und IT-Sicherehit B.Sc 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Code-Analyse\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Das ich vieles neues lerne und mich weiterbilden kann.\u003c/p>"},{"name":"ahyi","studium":"Wirtschaftsinformatik Semester 3","suche":"ahyi studiengang und semester wirtschaftsinformatik semester 3","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>… Wirtschaftsinformatik Semester 3\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…\u003c/p>"},{"name":"akyf","studium":"Wirschaftsinformatik 3. Semester","suche":"akyf studiengang und semester wirschaftsinformatik 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>… Wirschaftsinformatik 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich wusste bisher sehr wenig über das Thema Softwareentwickung. je mehr ich lerne, worüber es im Allgemeinen geht, desto interessanter finde ich das Ganze. …\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>von der Veranstaltung erwarte ich noch mehr praktische und theoretische Kenntnisse rund um den Begriff Softwareentwickung zu erwerben.Zudem erwarte ich auch, dass der Dozent sich Zeit nimmt, um alles, insbesondere die für Studierende relevante Themen, möglichst ausführlich zu erklären. …\u003c/p>"},{"name":"ale563","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"ale563 studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…\u003c/p>"},{"name":"Anas23088","studium":"Ich studiere Wirtschaftsinformatik und bin im 5. Semester.","suche":"anas23088 studiengang und semester ich studiere wirtschaftsinformatik und bin im 5. semester.","html":"\u003cp>Ich belege diese Semester das Modul Softwaretechnik\u003c/p>\n\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik und bin im 5. Semester.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bisher erste Erfahrungen mit Softwareentwicklung gesammelt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte lernen, wie man mit Git und GitHub arbeitet und Softwareprojekte entwickelt. Außerdem möchte ich lernen, wie man gemeinsam an Softwareprojekte arbeitet.\u003c/p>"},{"name":"anddun","studium":"Wirtschaftsinformatik Bachelor im 3. Semester","suche":"anddun studiengang und semester wirtschaftsinformatik bachelor im 3. semester","html":"\u003cp>Steckbrief anddun\u003c/p>\n\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik Bachelor im 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe in der zweijährigen höheren Berufsfachschule für Informationsverarbeitung bereits Erfahrung durch Visual Basic in Softwareentwicklung gemacht\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erwarte, dass ich neues Wissen erlange für die Zukunft\u003c/p>"},{"name":"andel0","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"andel0 studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Habe das Modul &quot;Einführung in die Programmierung&quot; an der THM absolviert und habe dort die Grundlagen von Java gelernt. Ansonsten habe ich ein paar kleine Bash Skripte geschrieben.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Da ich mich für Cybersecurity interessiere, würde ich mich sehr für die Sicherheitsaspekte von Software interessieren und auch wünschen, dass diese auch behandelt werden. :-)\u003c/p>"},{"name":"anpa","studium":"Ich studiere Wirtschaftsinformatik und bin im siebten Semester","suche":"anpa studiengang und semester ich studiere wirtschaftsinformatik und bin im siebten semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik und bin im siebten Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bereits erste Erfahrungen mit der Programmiersprache Java gesammelt und grundlegende Programmierkonzepte kennengelernt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte lernen, wie man Git zur Versionsverwaltung nutzt und wie man gemeinsam an Softwareprojekten arbeitet. Außerdem möchte ich die einzelnen Schritte der Softwareentwicklung besser verstehen.\u003c/p>\n\u003cp>Ich freue mich darauf, das Gelernte praktisch anzuwenden.\u003c/p>"},{"name":"anushka","studium":"Wirtschaftsinformatik Semester 3","suche":"anushka studiengang und semester wirtschaftsinformatik semester 3","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik Semester 3\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…\u003c/p>"},{"name":"AR","studium":"Wirtschaftsinformatik und 5 Semester","suche":"ar studiengang und semester wirtschaftsinformatik und 5 semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>…Wirtschaftsinformatik und 5 Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>… kleinere Websites mit html und css erstellt und mit Java Objektorientiert programmiert.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…Ich möchte lernen, wie man mit Git im Team arbeitet.\u003c/p>"},{"name":"asi","studium":"Wirtschaftsinformatik, 3. Semester","suche":"asi studiengang und semester wirtschaftsinformatik, 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>…Wirtschaftsinformatik, 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…Bisher gar keine Erfahrungen\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…Ich erwarte eine gute Einführung in die Softwaretechnik und ggf. eigene Projekte bauen zu können.\u003c/p>"},{"name":"asng24","studium":"","suche":"asng24 studiengang und semester ","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>ich habe keine Erfahrung mit Softwareentwicklung …\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>… Ich möchte lernen, wie man Softwareprojekte gemeinsam plant und mit Git und GitHub bearbeitet.\u003c/p>"},{"name":"athr","studium":"Wirtschaftsinformatik 3.Semester","suche":"athr studiengang und semester wirtschaftsinformatik 3.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik 3.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>ich habe github persönlich erfunden mit gerlach\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>wenig theorie mehr praxis, um sich mehr zu engagieren. mehr bonuspunkte für die Klausur ^^\u003c/p>"},{"name":"avon507","studium":"Wirtschaftsinformatik, 3.Semester","suche":"avon507 studiengang und semester wirtschaftsinformatik, 3.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik, 3.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe Erfahrungen in kleinen Skripten und in den Grundlagen der Programmierung gesammelt. Der Schlüssel zum Erfolg liegt nicht in einmaligen Anstrengungen sondern in kontinuierlichen Praxis.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erwarte einen tiefgründigen Einblick in die Methoden und Werkzeuge der Softwaretechnik. Die Grundlagen nachhaltig und zukunftsorientiert zu lernen, insbesondere im Hinblick auf den Einsatz von Künstlicher Intelligenz.\u003c/p>"},{"name":"Aza","studium":"Organisations und IT Sicherheit 3.Semester Beachlor","suche":"aza studiengang und semester organisations und it sicherheit 3.semester beachlor","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Organisations und IT Sicherheit 3.Semester Beachlor\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe leider noch nicht so viel Erfahrung bisher gesammelt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Das ich in dem Modul was neues Lernen kann und lerne wie man eine Software entwickelt.\u003c/p>"},{"name":"azm96","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"azm96 studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Programmieren 1 in Java. Mit Git habe ich bisher nicht gearbeitet.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte lernen, wie man im Team an Software arbeitet.\u003c/p>"},{"name":"Bblj09","studium":"Wirtschaftsinformatik (Bachelor), 5.Semester","suche":"bblj09 studiengang und semester wirtschaftsinformatik (bachelor), 5.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik (Bachelor), 5.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe im Studium erste Erfahrungen mit Java gesammelt. Dabei habe ich kleinere Programme und Übungsaufgaben bearbeitet.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte lernen, wie man Softwareprojekte strukturiert plant und gemeinsam mit Git und Github bearbeitet …\u003c/p>"},{"name":"bima","studium":"Wirtschaftsinformatik (B.Sc.), 7. Semester, THM","suche":"bima studiengang und semester wirtschaftsinformatik (b.sc.), 7. semester, thm","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik (B.Sc.), 7. Semester, THM\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Im Studium habe ich ein Webtechnologien-Projekt umgesetzt, ein Buchungssystem für Lagerräume mit HTML, CSS, JavaScript, PHP, MariaDB und Docker, sowie ein DevOps-Projekt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte Softwaretechnik gut verstehen und lernen, wie sie in der Praxis angewendet wird und wofür man sie einsetzt.\u003c/p>"},{"name":"bunter95","studium":"Wirtschaftsinformatik B.Sc. im dritten Semester.","suche":"bunter95 studiengang und semester wirtschaftsinformatik b.sc. im dritten semester.","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc. im dritten Semester.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Noch keine Erfahrungen sammeln können.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Neues Wissen zu erlernen und dies strategisch einzusetzen.\u003c/p>"},{"name":"cms","studium":"Wirtschaftsinformatik 3. Semester","suche":"cms studiengang und semester wirtschaftsinformatik 3. semester","html":"\u003ch3>Studiengang  und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bisher kaum Erfahrung mit Softwareentwicklung. Meine bisherigen Erfahrungen liegen eher im Bereich Verkauf und sozialer Tätigkeiten. Meine Motivation, diesen Studiengang zu absolvieren, ist meine Faszination für technische Themen und Informationen. Ich möchte mehr darüber lernen, wie Software entwickelt wird und wie technische Lösungen entstehen.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erwarte von der Verantstaltungen, dass die Grundlagen der Softwareentwicklung besser verstehen, gleichzeitig möchte gerne die praktische Anwendung mit Git und Github Programm lernen und vor allem wie man gemeinsam an Sorfwareprojekt arbeitet,weil ich bisher noch keine Erfahrung damit habe.\u003c/p>"},{"name":"datr03","studium":"Wirtschaftsinformatik B.Sc., 5. Semester","suche":"datr03 studiengang und semester wirtschaftsinformatik b.sc., 5. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 5. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Programmieren vorallem mit Java, Flutter. Webbasierte Projekte mit JavaScript. WipeCoding von mehreren WebApps.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte die Grundlagen und wichitgsten Anforderungen für ein Softwareprojekt erlernen um in Zukunft auch für eigene Projekte das Knowledge zu haben.\u003c/p>"},{"name":"davn68","studium":"Wirtschaftsinformatik B.Sc., 5. Semester","suche":"davn68 studiengang und semester wirtschaftsinformatik b.sc., 5. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 5. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Einführung in die Programmierung bestanden\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>das ich dieses Modul bestehe!\u003c/p>"},{"name":"dhfn1611","studium":"Wirtschaftsinformatik 3. Semester","suche":"dhfn1611 studiengang und semester wirtschaftsinformatik 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik 3. Semester …\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…Projektmanagement bei Siemens\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…Aktuelle Themen besprechen und ein tiefers verständnis für Software\u003c/p>"},{"name":"div","studium":"Wirschaftinformatik 5. Semester","suche":"div studiengang und semester wirschaftinformatik 5. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirschaftinformatik 5. Semester\u003c/p>\n\u003cp>…\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Im Rahmen meines Studiums konnte ich bereits praktische Erfahrungen in der Softwareentwicklung sammeln. Dabei habe ich mich insbesondere mit der Entwicklung von Webanwendungen, der Datenbankverwaltung und der strukturierten Umsetzung von Softwareprojekten beschäftigt.\u003c/p>\n\u003cp>Ein wichtiger Bestandteil meiner bisherigen Erfahrungen ist das Hochschulprojekt **SkillMatch**. Gemeinsam mit meinem Projektteam habe ich an der Entwicklung einer Webanwendung gearbeitet, die Unternehmen bei der passenden Zuordnung von Mitarbeitenden zu Projekten unterstützt. Mithilfe eines Matching-Scores werden die vorhandenen Kompetenzen der Mitarbeitenden mit den Anforderungen eines Projekts verglichen.\u003c/p>\n\u003cp>Während dieses Projekts konnte ich Erfahrungen mit verschiedenen Technologien und Werkzeugen sammeln, darunter **PHP, MariaDB, Docker, Git, GitHub und APIs**. Darüber hinaus habe ich mich mit der Analyse und Dokumentation von Softwareanforderungen, der Erstellung von Anwendungsfällen sowie der Modellierung von Softwarearchitekturen beschäftigt.\u003c/p>\n\u003cp>Neben SkillMatch habe ich bereits eigene Webseiten erstellt und mich dabei mit den Grundlagen der Webentwicklung beschäftigt. Dazu gehören insbesondere die Strukturierung von Webseiten mit **HTML**, die Gestaltung mit **CSS** und die Umsetzung interaktiver Funktionen mit **JavaScript**.\u003c/p>\n\u003cp>Durch diese praktischen Arbeiten konnte ich mein Verständnis für die Zusammenarbeit zwischen Frontend, Backend und Datenbanken erweitern.\u003c/p>\n\u003cp>Zusätzlich habe ich Erfahrungen mit der Planung und Dokumentation von Softwareprojekten gesammelt. Dazu zählen die Erstellung technischer Spezifikationen, die Beschreibung von Anwendungsfunktionen sowie die Darstellung von Systemabläufen durch Diagramme.\u003c/p>\n\u003cp>Meine bisherigen Erfahrungen haben mir geholfen, sowohl meine technischen Fähigkeiten als auch mein Verständnis für die strukturierte Entwicklung von Softwarelösungen weiterzuentwickeln. Besonders interessiere ich mich für die Webentwicklung, die Entwicklung datenbankgestützter Anwendungen und die praktische Umsetzung neuer Softwareideen. …\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Von der Lehrveranstaltung Softwaretechnik erwarte ich, dass ich meine bisherigen praktischen Erfahrungen in der Softwareentwicklung erweitern und vertiefen kann. Besonders möchte ich lernen, wie komplexe Softwareprojekte strukturiert geplant, entwickelt und getestet werden. Außerdem möchte ich meine Kenntnisse in der Softwarearchitektur, der Qualitätssicherung und der Teamarbeit verbessern. Mein Ziel ist es, zukünftig nicht nur funktionierende Anwendungen zu entwickeln, sondern auch sauberen, wartbaren und professionell strukturierten Code zu schreiben. …\u003c/p>"},{"name":"dlm28","studium":"Wirtschaftsinformatik 3.Semester","suche":"dlm28 studiengang und semester wirtschaftsinformatik 3.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik 3.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>… Java in der Oberstufe, Einführung in die Programmierung und AD\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…Verbesserung der Programmierskills und Perspektiven durch Ki einsatz\u003c/p>"},{"name":"dmal2004","studium":"Wirtschaftsinformatik B.Sc., 3.Semester","suche":"dmal2004 studiengang und semester wirtschaftsinformatik b.sc., 3.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>bisschen Java, aus dem ersten Semeste\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Erweiterung meines jetzigen Standes\u003c/p>"},{"name":"dmmh1710","studium":"Wirtschaftsinformatik Semester 3","suche":"dmmh1710 studiengang und semester wirtschaftsinformatik semester 3","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik Semester 3\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe keine bisherige Erfahrung.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Kommunikation und gute vorbereitung auf die Prüfung.\u003c/p>"},{"name":"dsc","studium":"Wirtschaftsinformatik B.Sc. 3. Semester","suche":"dsc studiengang und semester wirtschaftsinformatik b.sc. 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc. 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Programmieren 1 mit Java. Entwicklungen in Microsoft Power Automate sowie Power Apps. Erstellen kleiner Javascript Scripte. Experiementieren mit Python.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erhoffe mir, weitere Konzepte der Softwareentwicklung zu erlernen, sowie die ersten Versuche mit Github weiter zu vertiefen. Ebenfalls hoffe ich auf eine angenehme Veranstaltung.\u003c/p>"},{"name":"dsch","studium":"Wirtschaftsinformatik, 12. Semester","suche":"dsch studiengang und semester wirtschaftsinformatik, 12. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik, 12. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Praktische Erfahrung im DevOps-Umfeld, vor allem mit CI/CD-Pipelines, sowie Erfahrung mit Microsoft Azure. Git habe ich bisher eher nebenbei genutzt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte Git und GitHub sicher und sauber im Team einsetzen können und die Methoden der Softwaretechnik von Anforderungen bis Test strukturiert kennenlernen.\u003c/p>"},{"name":"dszp","studium":"Wirtschaftsinformatik B.Sc., 5. Semester","suche":"dszp studiengang und semester wirtschaftsinformatik b.sc., 5. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 5. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Einführung in die Programmierung mit Java.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Von der Veranstaltung erwarte ich, fundiertes und tieferes Wissen über Softwareentwicklung zu erlangen und den Umgang mit Git und GitHub zu lernen.\u003c/p>"},{"name":"ecib","studium":"Organisations & IT-Sicherheit","suche":"ecib studiengang und semester organisations & it-sicherheit","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Organisations &amp; IT-Sicherheit\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Grundkenntnisse Java durch IT-Fachabi und 1/2 Semester. Grundkenntnisse Webentwicklung (HTML, CSS, JS, PHP)\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte merh Technisches verständnis mir an eignen.\u003c/p>"},{"name":"ekes","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"ekes studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Programmieren 1 und 2 in Java, ein kleines Python-Skript für die Vereinskasse. Mit Git habe ich bisher nicht gearbeitet.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte verstehen, wie aus einer Idee ein Softwareprojekt wird, an dem mehrere Personen gleichzeitig arbeiten können.\u003c/p>"},{"name":"emalj","studium":"Wirtschaftsinformatik B.Sc., 7. Semester","suche":"emalj studiengang und semester wirtschaftsinformatik b.sc., 7. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 7. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cul>\n\u003cli>Hochschulmodule PRG, AD, DevOps, kleinere Hobbyprojekte, unter anderem kleines Spiel in Unity programmiert\u003c/li>\n\u003c/ul>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cul>\n\u003cli>Theoretisches und Praktisches Wissen in der Softwaretechnik erweitern\u003c/li>\n\u003cli>Klausur bestehen\u003c/li>\n\u003cli>Lernen, Beschreibungen und Anforderungen richtig zu lesen und zu verstehen.\u003c/li>\n\u003c/ul>"},{"name":"emrano","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"emrano studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester …\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>PG, BSR, AD, JS, PY …\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Spaß und erste Erfahrungen in der Softwareentwicklung sammeln. Zusätzlich wissen wie man gut organisierte Dokumentationen schreibt. …\u003c/p>"},{"name":"en7-mj","studium":"","suche":"en7-mj studiengang und semester ","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Bisher keine Erfahrungen mit Softwareentwicklung\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Die Grundlagen der Softwareentwicklung effizient zu lernen und das Gelernte als Softwareprojekt in einer selbst gewählten Gruppe umzusetzen.\u003c/p>"},{"name":"ezen","studium":"Wirtschaftsinformatik 3.Semester","suche":"ezen studiengang und semester wirtschaftsinformatik 3.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik 3.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe im ersten Semester Einführung in die Programmierung bestanden und 003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Mehr verständnis dafür wie man Software-Systeme systematisch und effizient entwirft, entwickelt und wartet.\u003c/p>"},{"name":"fpz","studium":"Ich studiere im 5. Semester Softwaretechnik.","suche":"fpz studiengang und semester ich studiere im 5. semester softwaretechnik.","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere im 5. Semester Softwaretechnik.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Im Rahmen meines Studiums habe ich bereits erste Erfahrungen mit der Softwareentwicklung gesammelt. Ich habe mich mit verschiedenen Programmiersprachen und der Entwicklung kleiner Anwendungen beschäftigt.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte meine Kenntnisse in Git und GitHub vertiefen und die Zusammenarbeit in Softwareprojekten besser verstehen.\u003c/p>"},{"name":"hams","studium":"","suche":"hams studiengang und semester ","html":"\u003ch3>Wirtschaftsinformatik, 3. Semester\u003c/h3>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>noch keine Erfahrung, nur die Grundlagen von Programmieren mit Java\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ein besseres Verständnis von coden zu erlangen und vielleicht irgendwann in der Lage sein können eigene Games zu codieren\u003c/p>"},{"name":"hfdr12","studium":"Wirtschaftsinformatik B.Sc., 3. Semester","suche":"hfdr12 studiengang und semester wirtschaftsinformatik b.sc., 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc., 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Bisher habe ich erste Erfahrungen mit Java gesammelt. Ich habe einfache Programme geschrieben und dabei Grundlagen wie Variablen, Bedingungen, Schleifen, Methoden und Klassen kennengelernt. Mit Git und gemeinsamer Sof lorg","suche":"peng studiengang und semester wirtschaftsinformatik 3.semester bachelorg","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik 3.Semester Bachelorg\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>mein Onkel hat mir programmieren beigebracht\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>das altaf mo sachen zeigt\u003c/p>"},{"name":"pgml","studium":"Ich studiere Wirtschaftsinformatik an der Technischen Hochschule Mitt…","suche":"pgml studiengang und semester ich studiere wirtschaftsinformatik an der technischen hochschule mittelhessen (thm) am campus friedberg und befinde mich derzeit im fünften fachsemester.","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik an der Technischen Hochschule Mittelhessen (THM) am Campus Friedberg und befinde mich derzeit im fünften Fachsemester.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bereits umfangreiche Erfahrungen in der Softwareentwicklung gesammelt. Während meines Studiums und verschiedener Praxisprojekte habe ich Anwendungen mit Java, Python und JavaScript entwickelt. Darüber hinaus habe ich an der Entwicklung datenbasierter Anwendungen mitgewirkt und erste Erfahrungen im Bereich Machine Learning gesammelt.\u003c/p>\n\u003cp>Besonders interessant finde ich die Entwicklung skalierbarer Softwaresysteme sowie die Arbeit mit Cloud-Technologien. Außerdem bin ich mit agilen Entwicklungsmethoden wie Scrum und der Versionsverwaltung mit Git vertraut.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Von der Veranstaltung Softwaretechnik erwarte ich, dass ich meine Kenntnisse über die systematische Planung, Entwicklung und Wartung komplexer Softwaresysteme vertiefen kann.\u003c/p>\n\u003cp>Besonders interessieren mich moderne Softwarearchitekturen, agile Entwicklungsmethoden sowie die Qualitätssicherung durch automatisierte Tests. Darüber hinaus möchte ich lernen, wie Softwareprojekte effizient organisiert und im Team erfolgreich umgesetzt werden können.\u003c/p>"},{"name":"pz01","studium":"Ich studiere Wirtschaftsinformatik an der THM in Friedberg und befind…","suche":"pz01 studiengang und semester ich studiere wirtschaftsinformatik an der thm in friedberg und befinde mich im 3. semester.","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik an der THM in Friedberg und befinde mich im 3. Semester.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bisher erste Grundlagen der Programmierung im Studium kennengelernt. Meine praktischen Erfahrungen mit Softwareentwicklung sind noch begrenzt, aber ich möchte meine Kenntnisse weiter ausbauen.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erwarte von der Veranstaltung, dass ich die Grundlagen der Softwareentwicklung besser verstehe und lerne, wie Softwareprojekte geplant und umgesetzt werden. Besonders möchte ich praktische Erfahrungen sammeln und den Umgang mit Git und GitHub verbessern.\u003c/p>"},{"name":"qdb","studium":"Wirtschaftsinformatik B.Sc 3. Semester","suche":"qdb studiengang und semester wirtschaftsinformatik b.sc 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik B.Sc 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…\u003c/p>"},{"name":"qho","studium":"Ich studiere Wirtschaftsinformatik im 3. Semester an der THM am Campu…","suche":"qho studiengang und semester ich studiere wirtschaftsinformatik im 3. semester an der thm am campus friedberg.","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik im 3. Semester an der THM am Campus Friedberg.\u003c/p>\n\u003ch3>Meine bishe 3c/p>"},{"name":"sahmad","studium":"Ich studiere Wirtschaftsinformatik (B.Sc.) an der THM am Campus Fried…","suche":"sahmad studiengang und semester ich studiere wirtschaftsinformatik (b.sc.) an der thm am campus friedberg und befinde mich aktuell im 3. semester.","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik (B.Sc.) an der THM am Campus Friedberg und befinde mich aktuell im 3. Semester.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe im Studium erste Grundlagen der Programmierung kennengelernt und bereits einfache Programme geschrieben. Mit der professionellen Softwareentwicklung und der Zusammenarbeit über Git und GitHub habe ich bisher wenig Erfahrung.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte in dieser Veranstaltung lernen, wie Softwareprojekte professionell geplant, entwickelt und umgesetzt werden. Besonders interessiert mich die Zusammenarbeit im Team sowie der praktische Umgang mit Git und GitHub. Außerdem möchte ich meine Programmierkenntnisse erweitern.\u003c/p>"},{"name":"sahmed","studium":"Wirtschaftsinformatik / 3.Semester","suche":"sahmed studiengang und semester wirtschaftsinformatik / 3.semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik / 3.Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>…\u003c/p>"},{"name":"sam","studium":"Wirtschaftsinformatik, 3. Semester","suche":"sam studiengang und semester wirtschaftsinformatik, 3. semester","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Wirtschaftsinformatik, 3. Semester\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Bisher keine wirklichen, nur etwas Java im ersten Semester.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich erwarte, dass ich mehr Kenntnisse in dem Bereich erlange, mein Können erweitere und ggf. auch eigene Projekte damit bauen kann.\u003c/p>"},{"name":"sazy1","studium":"Ich studiere Wirtschaftsinformatik und bin im dritten Semester.","suche":"sazy1 studiengang und semester ich studiere wirtschaftsinformatik und bin im dritten semester.","html":"\u003cp>Steckbrief sazy1\u003c/p>\n\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cp>Ich studiere Wirtschaftsinformatik und bin im dritten Semester.\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Ich habe bisher wenig Erfahrung mit Softwareentwicklung. Ich möchte lernen, wie man mit Git und GitHub arbeitet.\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte die Grundlagen der Softwareentwicklung lernen und sicher mit Git und GitHub umgehen können.\u003c/p>\n\u003ch3>Aufgabe 3\u003c/h3>\n\u003cp>Diese Änderung habe ich direkt im GitHub-Browser gemacht.\u003c/p>"},{"name":"sd99","studium":"Studiengang: Wirtschaftsinformatik B.Sc Wirtschaftsinformatik B.Sc Se…","suche":"sd99 studiengang und semester studiengang: wirtschaftsinformatik b.sc wirtschaftsinformatik b.sc semester: 7","html":"\u003ch3>Studiengang und Semester\u003c/h3>\n\u003cul>\n\u003cli>Studiengang: Wirtschaftsinformatik B.Sc\u003c/li>\n\u003cli>Semester: 7\u003c/li>\n\u003c/ul>\n\u003cp>…\u003c/p>\n\u003ch3>Meine bisherige Erfahrung mit Softwareentwicklung\u003c/h3>\n\u003cp>Meine ersten Erfahrungen mit der Softwareentwicklung habe ich mit Flutter und Dart gesammelt. Angefangen hat alles mit einer einfachen To-do-App im Rahmen einer Übung. Danach habe ich mich weiter mit Flutter beschäftigt und eine eigene Android-App entwickelt. Wenn ich heute an meinen damaligen Code denke, muss ich schmunzeln. Von einer richtigen Struktur war ich damals noch weit entfernt.\u003c/p>\n\u003cp>Im Studium haben wir von Anfang an mit Java gearbeitet. Zwischendurch habe ich auch Python, JavaScript, HTML und CSS ausprobiert. Irgendwann habe ich gemerkt, dass es sinnvoller ist, sich erst einmal auf eine Programmiersprache zu konzentrieren, statt ständig zwischen verschiedenen Sprachen zu wechseln.\u003c/p>\n\u003cp>Also bin ich bei Java geblieben und habe mich intensiver damit beschäftigt. Zunächst habe ich eine To-do-Anwendung ohne grafische Oberfläche programmiert. Mittlerweile arbeite ich an einer eigenen Web-App mit Java, Spring Boot, MySQL, HTML und CSS.\u003c/p>\n\u003cp>Dabei lerne ich besonders viel über das Zusammenspiel von Frontend und Backend. Ich merke, dass ich durch die Arbeit an einem eigenen Projekt vieles besser verstehe.\u003c/p>\n\u003cp>ChatGPT nutze ich zusätzlich als Lernhilfe, um Fragen zu klären und Code besser zu verstehen. Ich muss zwar immer noch vieles nachschlagen, aber das gehört für mich zum Lernen dazu.\u003c/p>\n\u003cp>Ich bin noch lange kein Profi, aber mittlerweile macht mir das Programmieren richtig Spaß.\u003c/p>\n\u003cp>…\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Ich möchte in dieser Veranstaltung vor allem lernen, wie man größere Softwareprojekte richtig plant und strukturiert. Bisher habe ich bei meinen eigenen Projekten vieles einfach ausprobiert und dabei gelernt. Jetzt würde ich gerne verstehen, wie man von Anfang an besser vorgeht und sauberen, übersichtlichen Code schreibt.\u003c/p>\n\u003cp>Besonders interessiert mich die Softwarearchitektur. Ich möchte verstehen, wie man eine Anwendung so aufbaut, dass sie auch bei neuen Funktionen übersichtlich und leicht erweiterbar bleibt. Außerdem würde ich gerne lernen, wie ein Softwareprojekt von der ersten Idee über die Planung bis zur fertigen Anwendung entsteht.\u003c/p>\n\u003cp>Spannend finde ich auch, wie Entwickler in Unternehmen zusammenarbeiten, zum Beispiel mit Git, GitHub und Code Reviews. Ich möchte lernen, mich besser in fremden Code einzuarbeiten, Software richtig zu testen und Fehler systematisch zu finden.\u003c/p>\n\u003cp>Wic  …\u003c/p>\n\u003ch3>Das erwarte ich von der Veranstaltung\u003c/h3>\n\u003cp>Das es lustig wird. …\u003c/p>"}];

    const suche = document.getElementById("suche");
    const liste = document.getElementById("liste");
    const treffer = document.getElementById("treffer");
    const detailName = document.getElementById("detail-name");
    const githubLink = document.getElementById("github-link");
    const detailInhalt = document.getElementById("detail-inhalt");

    let gewaehlt = null;

    function passend(beitrag, begriff) {
      return beitrag.suche.includes(begriff);
    }

    function zeige(beitrag) {
      gewaehlt = beitrag;
      if (!beitrag) {
        detailName.textContent = "";
        detailInhalt.textContent = "Kein Steckbrief passt zur Suche.";
        githubLink.hidden = true;
        return;
      }
      detailName.textContent = beitrag.name;
      githubLink.href = "https://github.com/" + encodeURIComponent(beitrag.name);
      githubLink.hidden = false;
      detailInhalt.innerHTML = beitrag.html;
      for (const button of liste.querySelectorAll(".eintrag")) {
        button.setAttribute("aria-current", String(button.dataset.name === beitrag.name));
      }
    }

    function aktualisiere() {
      const begriff = suche.value.trim().toLowerCase();
      const trefferliste = steckbriefe.filter((beitrag) => passend(beitrag, begriff));

      liste.replaceChildren();
      for (const beitrag of trefferliste) {
        const li = document.createElement("li");
        const button = document.createElement("button");
        const name = document.createElement("span");
        const studium = document.createElement("span");

        button.type = "button";
        button.className = "eintrag";
        button.dataset.name = beitrag.name;
        button.setAttribute("aria-current", "false");
        name.className = "name";
        name.textContent = beitrag.name;
        studium.className = "studium";
        studium.textContent = beitrag.studium;
        button.append(name, studium);
        button.addEventListener("click", () => zeige(beitrag));
        li.append(button);
        liste.append(li);
      }

      treffer.textContent = begriff === ""
        ? steckbriefe.length + " Steckbriefe"
        : trefferliste.length + " von " + steckbriefe.length + " Steckbriefen";

      if (!trefferliste.includes(gewaehlt)) {
        zeige(trefferliste[0] || null);
      } else {
        zeige(gewaehlt);
      }
    }

    suche.addEventListener("input", aktualisiere);
    aktualisiere();
  </script>
